name: test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  go:
    runs-on: ubuntu-latest
    name: Test Go
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
      id: go
    - name: gofmt
      run: test -z "$(gofmt -s -l . | tee /dev/stderr)"
    - name: Run Staticcheck
      uses: dominikh/staticcheck-action@v1
      with:
        version: "latest"
        install-go: false
    - name: go vet
      run: go vet ./...
    - name: go test
      run: go test -race -v ./...
    - name: go build
      run: make all
  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install modules
      run: yarn
    - name: Run ESLint
      run: yarn lint
